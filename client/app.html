<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangalore Home Price Prediction</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="app.css">
</head>

<body>
    <div class="background-overlay"></div>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1 class="title">🏠 Bangalore Home Price Predictor</h1>
                <p class="subtitle">Get an instant estimate for your dream home</p>
            </div>

            <div class="card-body">
                <form class="prediction-form">
                    <div class="form-group">
                        <label for="uiSqft" class="form-label">
                            <span class="label-icon">📐</span>
                            Area (Square Feet)
                        </label>
                        <input type="number" id="uiSqft" name="Squareft" class="form-input" value="1000" min="100"
                            step="100" placeholder="Enter area in square feet">
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <span class="label-icon">🛏️</span>
                            Bedrooms (BHK)
                        </label>
                        <div class="switch-field">
                            <input type="radio" id="radio-bhk-1" name="uiBHK" value="1" />
                            <label for="radio-bhk-1">1</label>
                            <input type="radio" id="radio-bhk-2" name="uiBHK" value="2" checked />
                            <label for="radio-bhk-2">2</label>
                            <input type="radio" id="radio-bhk-3" name="uiBHK" value="3" />
                            <label for="radio-bhk-3">3</label>
                            <input type="radio" id="radio-bhk-4" name="uiBHK" value="4" />
                            <label for="radio-bhk-4">4</label>
                            <input type="radio" id="radio-bhk-5" name="uiBHK" value="5" />
                            <label for="radio-bhk-5">5</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <span class="label-icon">🚿</span>
                            Bathrooms
                        </label>
                        <div class="switch-field">
                            <input type="radio" id="radio-bath-1" name="uiBathrooms" value="1" />
                            <label for="radio-bath-1">1</label>
                            <input type="radio" id="radio-bath-2" name="uiBathrooms" value="2" checked />
                            <label for="radio-bath-2">2</label>
                            <input type="radio" id="radio-bath-3" name="uiBathrooms" value="3" />
                            <label for="radio-bath-3">3</label>
                            <input type="radio" id="radio-bath-4" name="uiBathrooms" value="4" />
                            <label for="radio-bath-4">4</label>
                            <input type="radio" id="radio-bath-5" name="uiBathrooms" value="5" />
                            <label for="radio-bath-5">5</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="uiLocations" class="form-label">
                            <span class="label-icon">📍</span>
                            Location
                        </label>
                        <select class="form-select" id="uiLocations" name="location">
                            <option value="" disabled selected>Select a location</option>
                            <option>Electronic City</option>
                            <option>Rajaji Nagar</option>
                        </select>
                    </div>

                    <button type="button" class="submit-btn" onclick="onClickedEstimatePrice()">
                        <span class="btn-text">Estimate Price</span>
                        <span class="btn-icon">💰</span>
                    </button>
                </form>

                <div id="uiEstimatedPrice" class="result-card">
                    <div class="result-content">
                        <span class="result-label">Estimated Price</span>
                        <h2 class="result-price"></h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
